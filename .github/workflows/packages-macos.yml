# Tests for AegisKit on macOS and the macOS-only packages (XPC, EventKit, Contacts) on every PR that changes code.
name: Packages (macOS)

on:
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: packages-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-macos:
    name: core-macos
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: AegisKit tests (macOS)
        working-directory: Packages/AegisKit
        run: swift test
      - name: SharedIPC tests (macOS only, XPC)
        working-directory: Packages/SharedIPC
        run: swift test
      - name: MacSources tests (macOS only, EventKit and Contacts mapping)
        working-directory: Packages/MacSources
        run: swift test
