# macOS app build + tests on every PR that changes code (free on a public repo). Unsigned, synthetic data only.
name: App (macOS)

on:
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: app
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: brew install xcodegen swiftlint
      - name: Generate project
        run: xcodegen generate
      - name: Lint
        run: swiftlint lint --quiet
      - name: Build and test
        run: |
          xcodebuild -project Aegis.xcodeproj -scheme AegisApp \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO test
